services:
  users-db-main:
    image: postgres:16
    container_name: users-db-main
    environment:
      POSTGRES_DB: usersdb_main
      POSTGRES_USER: users_app
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:?Set USERS_DB_PASSWORD in .env}
    volumes:
      - usersdb_main_data:/var/lib/postgresql/data
      - ./database/init-app-user.sh:/docker-entrypoint-initdb.d/10-restrict-app-user.sh:ro
    networks:
      - main-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users_app -d usersdb_main"]
      interval: 5s
      timeout: 5s
      retries: 10

  turnos-db-main:
    image: postgres:16
    container_name: turnos-db-main
    environment:
      POSTGRES_DB: turnosdb_main
      POSTGRES_USER: turnos_app
      POSTGRES_PASSWORD: ${TURNOS_DB_PASSWORD:?Set TURNOS_DB_PASSWORD in .env}
    volumes:
      - turnosdb_main_data:/var/lib/postgresql/data
      - ./database/init-app-user.sh:/docker-entrypoint-initdb.d/10-restrict-app-user.sh:ro
    networks:
      - main-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnos_app -d turnosdb_main"]
      interval: 5s
      timeout: 5s
      retries: 10

  notifications-db-main:
    image: postgres:16
    container_name: notifications-db-main
    environment:
      POSTGRES_DB: notificationsdb_main
      POSTGRES_USER: notifications_app
      POSTGRES_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?Set NOTIFICATIONS_DB_PASSWORD in .env}
    volumes:
      - notificationsdb_main_data:/var/lib/postgresql/data
      - ./database/init-app-user.sh:/docker-entrypoint-initdb.d/10-restrict-app-user.sh:ro
    networks:
      - main-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifications_app -d notificationsdb_main"]
      interval: 5s
      timeout: 5s
      retries: 10

  audit-db-main:
    image: mongo:7
    container_name: audit-db-main
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-audit_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:?Set MONGODB_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: auditdb_main
      MONGODB_APP_USER: audit_app
      MONGODB_APP_PASSWORD: ${MONGODB_APP_PASSWORD:?Set MONGODB_APP_PASSWORD in .env}
    volumes:
      - auditdb_main_data:/data/db
      - ./database/init-mongo-app-user.sh:/docker-entrypoint-initdb.d/10-create-audit-user.sh:ro
    networks:
      - main-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --quiet --eval \"db.runCommand({ ping: 1 }).ok\""]
      interval: 10s
      timeout: 10s
      retries: 15

  users-service-main:
    build:
      context: ./backend/users-service
      dockerfile: Dockerfile
    container_name: users-service-main
    depends_on:
      users-db-main:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: main
      SPRING_DATASOURCE_URL: jdbc:postgresql://users-db-main:5432/usersdb_main
      SPRING_DATASOURCE_USERNAME: users_app
      SPRING_DATASOURCE_PASSWORD: ${USERS_DB_PASSWORD:?Set USERS_DB_PASSWORD in .env}
      JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64:?Set JWT_PRIVATE_KEY_BASE64 in .env}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?Set JWT_PUBLIC_KEY_BASE64 in .env}
    networks:
      - main-net
    restart: unless-stopped

  turnos-service-main:
    build:
      context: ./backend/turnos-service
      dockerfile: Dockerfile
    container_name: turnos-service-main
    depends_on:
      turnos-db-main:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: main
      SPRING_DATASOURCE_URL: jdbc:postgresql://turnos-db-main:5432/turnosdb_main
      SPRING_DATASOURCE_USERNAME: turnos_app
      SPRING_DATASOURCE_PASSWORD: ${TURNOS_DB_PASSWORD:?Set TURNOS_DB_PASSWORD in .env}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?Set JWT_PUBLIC_KEY_BASE64 in .env}
    networks:
      - main-net
    restart: unless-stopped

  notifications-service-main:
    build:
      context: ./backend/notifications-service
      dockerfile: Dockerfile
    container_name: notifications-service-main
    depends_on:
      notifications-db-main:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: main
      SPRING_DATASOURCE_URL: jdbc:postgresql://notifications-db-main:5432/notificationsdb_main
      SPRING_DATASOURCE_USERNAME: notifications_app
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?Set NOTIFICATIONS_DB_PASSWORD in .env}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?Set JWT_PUBLIC_KEY_BASE64 in .env}
    networks:
      - main-net
    restart: unless-stopped

  audit-service-main:
    build:
      context: ./backend/audit-service
      dockerfile: Dockerfile
    container_name: audit-service-main
    depends_on:
      audit-db-main:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: main
      SPRING_DATA_MONGODB_URI: mongodb://audit_app:${MONGODB_APP_PASSWORD:?Set MONGODB_APP_PASSWORD in .env}@audit-db-main:27017/auditdb_main?authSource=auditdb_main
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?Set JWT_PUBLIC_KEY_BASE64 in .env}
    networks:
      - main-net
    restart: unless-stopped

  api-gateway-main:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway-main
    depends_on:
      - users-service-main
      - turnos-service-main
      - notifications-service-main
      - audit-service-main
    environment:
      SPRING_PROFILES_ACTIVE: main
    ports:
      - "8280:8280"
    networks:
      - main-net
    restart: unless-stopped

  frontend-main:
    build:
      context: ./frontend/gestion-citas-frontend
      dockerfile: Dockerfile
      args:
        API_GATEWAY_URL: http://localhost:8280
    container_name: frontend-main
    depends_on:
      - api-gateway-main
    ports:
      - "4220:8080"
    networks:
      - main-net
    restart: unless-stopped

volumes:
  usersdb_main_data:
  turnosdb_main_data:
  notificationsdb_main_data:
  auditdb_main_data:

networks:
  main-net: