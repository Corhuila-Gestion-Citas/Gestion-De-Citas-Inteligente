name: CI - Gestion de Citas Inteligente

on:
  push:
    branches:
      - develop
      - qa
      - main

  pull_request:
    branches:
      - develop
      - qa
      - main

jobs:
  backend-build:
    name: Build backend microservices
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - backend/api-gateway
          - backend/users-service
          - backend/turnos-service
          - backend/notifications-service
          - backend/audit-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: mvn -B clean package -DskipTests

  frontend-build:
    name: Build Angular frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/gestion-citas-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/gestion-citas-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Build Angular project
        run: npm run build

      - name: Run Angular tests
        run: npm test -- --watch=false

  docker-compose-check:
    name: Validate Docker Compose files
    runs-on: ubuntu-latest
    env:
      USERS_DB_PASSWORD: ci-only-users-password
      TURNOS_DB_PASSWORD: ci-only-turnos-password
      NOTIFICATIONS_DB_PASSWORD: ci-only-notifications-password
      MONGODB_ROOT_PASSWORD: ci-only-mongodb-root-password
      MONGODB_APP_PASSWORD: ci-only-mongodb-app-password
      JWT_PRIVATE_KEY_BASE64: ci-only-private-key-placeholder
      JWT_PUBLIC_KEY_BASE64: ci-only-public-key-placeholder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Docker version
        run: docker --version

      - name: Show Docker Compose version
        run: docker compose version

      - name: Validate develop compose
        run: docker compose -f docker-compose.develop.yml config --quiet

      - name: Validate qa compose
        run: docker compose -f docker-compose.qa.yml config --quiet

      - name: Validate main compose
        run: docker compose -f docker-compose.main.yml config --quiet