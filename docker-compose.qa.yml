services:
  users-db-qa:
    image: postgres:16
    container_name: users-db-qa
    environment:
      POSTGRES_DB: usersdb_qa
      POSTGRES_USER: users_app
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:?Set USERS_DB_PASSWORD in .env}
    volumes:
      - usersdb_qa_data:/var/lib/postgresql/data
      - ./database/init-app-user.sh:/docker-entrypoint-initdb.d/10-restrict-app-user.sh:ro
    networks:
      - qa-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users_app -d usersdb_qa"]
      interval: 5s
      timeout: 5s
      retries: 10

  turnos-db-qa:
    image: postgres:16
    container_name: turnos-db-qa
    environment:
      POSTGRES_DB: turnosdb_qa
      POSTGRES_USER: turnos_app
      POSTGRES_PASSWORD: ${TURNOS_DB_PASSWORD:?Set TURNOS_DB_PASSWORD in .env}
    volumes:
      - turnosdb_qa_data:/var/lib/postgresql/data
      - ./database/init-app-user.sh:/docker-entrypoint-initdb.d/10-restrict-app-user.sh:ro
    networks:
      - qa-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnos_app -d turnosdb_qa"]
      interval: 5s
      timeout: 5s
      retries: 10

  notifications-db-qa:
    image: postgres:16
    container_name: notifications-db-qa
    environment:
      POSTGRES_DB: notificationsdb_qa
      POSTGRES_USER: notifications_app
      POSTGRES_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?Set NOTIFICATIONS_DB_PASSWORD in .env}
    volumes:
      - notificationsdb_qa_data:/var/lib/postgresql/data
      - ./database/init-app-user.sh:/docker-entrypoint-initdb.d/10-restrict-app-user.sh:ro
    networks:
      - qa-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifications_app -d notificationsdb_qa"]
      interval: 5s
      timeout: 5s
      retries: 10

  audit-db-qa:
    image: mongo:7
    container_name: audit-db-qa
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-audit_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:?Set MONGODB_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: auditdb_qa
      MONGODB_APP_USER: audit_app
      MONGODB_APP_PASSWORD: ${MONGODB_APP_PASSWORD:?Set MONGODB_APP_PASSWORD in .env}
    volumes:
      - auditdb_qa_data:/data/db
      - ./database/init-mongo-app-user.sh:/docker-entrypoint-initdb.d/10-create-audit-user.sh:ro
    networks:
      - qa-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --quiet --eval \"db.runCommand({ ping: 1 }).ok\""]
      interval: 10s
      timeout: 10s
      retries: 15

  users-service-qa:
    build:
      context: ./backend/users-service
      dockerfile: Dockerfile
    container_name: users-service-qa
    depends_on:
      users-db-qa:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: qa
      SPRING_DATASOURCE_URL: jdbc:postgresql://users-db-qa:5432/usersdb_qa
      SPRING_DATASOURCE_USERNAME: users_app
      SPRING_DATASOURCE_PASSWORD: ${USERS_DB_PASSWORD:?Set USERS_DB_PASSWORD in .env}
      JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64:?Set JWT_PRIVATE_KEY_BASE64 in .env}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?Set JWT_PUBLIC_KEY_BASE64 in .env}
    networks:
      - qa-net
    restart: unless-stopped

  turnos-service-qa:
    build:
      context: ./backend/turnos-service
      dockerfile: Dockerfile
    container_name: turnos-service-qa
    depends_on:
      turnos-db-qa:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: qa
      SPRING_DATASOURCE_URL: jdbc:postgresql://turnos-db-qa:5432/turnosdb_qa
      SPRING_DATASOURCE_USERNAME: turnos_app
      SPRING_DATASOURCE_PASSWORD: ${TURNOS_DB_PASSWORD:?Set TURNOS_DB_PASSWORD in .env}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?Set JWT_PUBLIC_KEY_BASE64 in .env}
    networks:
      - qa-net
    restart: unless-stopped

  notifications-service-qa:
    build:
      context: ./backend/notifications-service
      dockerfile: Dockerfile
    container_name: notifications-service-qa
    depends_on:
      notifications-db-qa:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: qa
      SPRING_DATASOURCE_URL: jdbc:postgresql://notifications-db-qa:5432/notificationsdb_qa
      SPRING_DATASOURCE_USERNAME: notifications_app
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?Set NOTIFICATIONS_DB_PASSWORD in .env}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?Set JWT_PUBLIC_KEY_BASE64 in .env}
    networks:
      - qa-net
    restart: unless-stopped

  audit-service-qa:
    build:
      context: ./backend/audit-service
      dockerfile: Dockerfile
    container_name: audit-service-qa
    depends_on:
      audit-db-qa:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: qa
      SPRING_DATA_MONGODB_URI: mongodb://audit_app:${MONGODB_APP_PASSWORD:?Set MONGODB_APP_PASSWORD in .env}@audit-db-qa:27017/auditdb_qa?authSource=auditdb_qa
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?Set JWT_PUBLIC_KEY_BASE64 in .env}
    networks:
      - qa-net
    restart: unless-stopped

  api-gateway-qa:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway-qa
    depends_on:
      - users-service-qa
      - turnos-service-qa
      - notifications-service-qa
      - audit-service-qa
    environment:
      SPRING_PROFILES_ACTIVE: qa
    ports:
      - "8180:8180"
    networks:
      - qa-net
    restart: unless-stopped

  frontend-qa:
    build:
      context: ./frontend/gestion-citas-frontend
      dockerfile: Dockerfile
      args:
        API_GATEWAY_URL: http://localhost:8180
    container_name: frontend-qa
    depends_on:
      - api-gateway-qa
    ports:
      - "4210:8080"
    networks:
      - qa-net
    restart: unless-stopped

volumes:
  usersdb_qa_data:
  turnosdb_qa_data:
  notificationsdb_qa_data:
  auditdb_qa_data:

networks:
  qa-net: